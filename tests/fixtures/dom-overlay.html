<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fixture: DOM-overlay captions player (YouTube-style)</title>
  <style>
    body { font: 14px system-ui; background: #111; color: #eee; padding: 24px; }
    .player { position: relative; width: 640px; height: 360px; background: #000; }
    .player video { width: 100%; height: 100%; }
    /* site-rendered caption overlay — no TextTrack involved */
    .caption-window {
      position: absolute; left: 0; right: 0; bottom: 8%;
      display: flex; justify-content: center; pointer-events: none;
    }
    .caption-segment {
      background: rgba(8, 8, 8, 0.75); color: #fff; font: 600 20px/1.3 sans-serif;
      padding: 2px 8px; white-space: pre-wrap;
    }
    button { margin-top: 12px; padding: 8px 14px; }
  </style>
</head>
<body>
  <h1>DOM-overlay captions fixture</h1>
  <p>Captions are rendered as positioned divs over the video, like YouTube/Netflix players do.</p>
  <div class="player">
    <video id="v" muted autoplay playsinline></video>
    <div class="caption-window" id="cw" style="display:none">
      <span class="caption-segment" id="cap"></span>
    </div>
  </div>
  <button id="activate">Activate PiP (test hook)</button>
  <button id="toggleCaps">Toggle captions</button>

  <script>
    const canvas = document.createElement('canvas');
    canvas.width = 640; canvas.height = 360;
    const ctx = canvas.getContext('2d');
    let t = 0;
    setInterval(() => {
      t += 1;
      ctx.fillStyle = `hsl(${(200 + t) % 360} 50% 25%)`;
      ctx.fillRect(0, 0, 640, 360);
      ctx.fillStyle = '#fff';
      ctx.font = '42px system-ui';
      ctx.fillText(`overlay fixture ${t}`, 40, 80);
    }, 33);
    const v = document.getElementById('v');
    v.srcObject = canvas.captureStream(30);

    const LINES = [
      'Captions painted by the page itself.',
      'No TextTrack anywhere in sight.',
      'The heuristic should still find me.',
      'Geometry, cadence, and class hints.',
    ];
    let i = 0;
    let enabled = true;
    const cw = document.getElementById('cw');
    const cap = document.getElementById('cap');
    setInterval(() => {
      if (!enabled) return;
      cap.textContent = LINES[i++ % LINES.length];
      cw.style.display = 'flex';
      setTimeout(() => { if (enabled) cw.style.display = 'none'; }, 1700);
    }, 2200);

    document.getElementById('toggleCaps').addEventListener('click', () => {
      enabled = !enabled;
      cw.style.display = 'none';
    });
    document.getElementById('activate').addEventListener('click', () => {
      window.dispatchEvent(new Event('PIPSUBS_TEST_ACTIVATE'));
    });
  </script>
</body>
</html>
