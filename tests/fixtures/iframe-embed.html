<html lang="en">
<head>

  <title>Fixture: cross-origin iframe embed</title>
  <style>
    body { font: 14px system-ui; background: #1c1917; color: #eee; padding: 24px; }
    iframe { border: 2px solid #444; }
  </style>

<body>
  <h1>Cross-origin iframe fixture</h1>
  <p>
    Serve via <code>npm run fixtures</code>, open this page on

          allow="picture-in-picture"></iframe>
