<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subly — Settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Subly</h1>
      <p class="lead">
        Click the toolbar button or press <kbd>Alt</kbd>+<kbd>P</kbd> on any page with a video.
        If the site's player has subtitles enabled, they appear in the floating window automatically.
      </p>

      <section class="preview-wrap">
        <div id="preview" class="preview">
          <div class="preview-bar"></div>
          <span id="previewCue" class="preview-cue">This is how your subtitles will look.</span>
        </div>
      </section>

      <form id="form">
        <label>
          Font size
          <input type="range" name="fontSizePct" min="2" max="14" step="0.5" />
          <output id="fontOut"></output>
        </label>
        <label>
          Font
          <select name="fontFamily">
            <option value="sans-serif">Sans-serif</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
          </select>
        </label>
        <label>
          Text color
          <input type="color" name="textColor" />
        </label>
        <label>
          Background color
          <input type="color" name="bgColor" />
        </label>
        <label>
          Background opacity
          <input type="range" name="bgOpacity" min="0" max="1" step="0.05" />
        </label>
        <label>
          Position
          <select name="position">
            <option value="bottom">Bottom</option>
            <option value="top">Top</option>
          </select>
        </label>
        <label>
          Edge style
          <select name="edgeStyle">
            <option value="shadow">Drop shadow</option>
            <option value="outline">Outline</option>
            <option value="none">None</option>
          </select>
        </label>
        <button type="button" id="reset">Reset to defaults</button>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
